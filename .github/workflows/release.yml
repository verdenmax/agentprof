name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Skeleton release workflow. The actual multi-platform binary release is wired
# up via `cargo-dist` once the first prototype lands. Until then, tagging a
# release simply uploads source artifacts.

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
