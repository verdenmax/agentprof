name: visual-guide

on:
  push:
    branches: [main]
    paths:
      - 'xtask/src/visual_guide/**'
      - 'xtask/templates/visual_guide/**'
      - 'docs/visual-guide/assets/**'
      - '.github/workflows/visual-guide.yml'
  pull_request:
    paths:
      - 'xtask/src/visual_guide/**'
      - 'xtask/templates/visual_guide/**'
      - 'docs/visual-guide/assets/**'
      - '.github/workflows/visual-guide.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          shared-key: visual-guide
      - name: Validate (xtask --check)
        run: cargo run -p xtask -- visual-guide --check
      - name: Build (main push only)
        if: github.event_name != 'pull_request'
        run: cargo run -p xtask -- visual-guide
      - name: Upload Pages artifact (main push only)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/visual-guide
      - name: Deploy to Pages (main push only)
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
