name: nightly-msrv

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: cargo check on declared MSRV (1.78)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Rolling ref intentionally NOT SHA-pinned (ADR-0014 D-6).
      # Note: dtolnay/rust-toolchain's @stable/@beta/@nightly tags ignore
      # the `toolchain:` input; only @master honors it, so non-stable
      # toolchain pins MUST use @master.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.78"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # Workspace review #5: `cargo check` skips dev-dep / proc-macro
      # builds that only get exercised by the test-target codepath.
      # `--all-targets` brings them in so MSRV failures in dev-deps
      # (e.g. a snapshot crate that bumped its own MSRV) surface here
      # rather than silently passing.
      - run: cargo check --workspace --all-features --all-targets
