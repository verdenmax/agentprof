name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Rolling ref intentionally NOT SHA-pinned (ADR-0014 D-6): we want each
      # CI run to pick up the current stable Rust toolchain.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Rolling ref intentionally NOT SHA-pinned (ADR-0014 D-6).
      # Note: dtolnay/rust-toolchain's @stable/@beta/@nightly tags ignore
      # the `toolchain:` input; only @master honors it, so non-stable
      # toolchain pins MUST use @master.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo test --workspace --all-features --no-fail-fast

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Rolling ref intentionally NOT SHA-pinned (ADR-0014 D-6): we want each
      # CI run to pick up the current stable Rust toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo doc --workspace --no-deps --all-features

  snapshots:
    name: insta snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Rolling ref intentionally NOT SHA-pinned (ADR-0014 D-6): we want each
      # CI run to pick up the current stable Rust toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo install cargo-insta --locked
      - run: cargo insta test --check

  feature-matrix:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Rolling ref intentionally NOT SHA-pinned (ADR-0014 D-6): we want each
      # CI run to pick up the current stable Rust toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo check -p agentprof-cli --no-default-features
      - run: cargo check -p agentprof-cli --no-default-features --features otlp
      - run: cargo check -p agentprof-cli --no-default-features --features web
      - run: cargo check -p agentprof-storage --no-default-features
      - run: cargo check -p agentprof-storage --no-default-features --features otlp
      - run: cargo check -p agentprof-storage --no-default-features --features progress

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1

  pii-guard:
    name: pii-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Rolling ref intentionally NOT SHA-pinned (ADR-0014 D-6): we want each
      # CI run to pick up the current stable Rust toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo run -p xtask -- audit-pii crates

  docs-sync:
    name: docs-sync (L1/L2/L3 enforcement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Every crate must have a README.md (L2)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for d in crates/*/ xtask/; do
            if [ ! -f "$d/README.md" ]; then
              echo "::error file=$d::missing README.md (L2 docs are mandatory)"
              fail=1
            fi
          done
          exit $fail
      - name: lib crates must have a top-level //! doc comment
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for f in crates/*/src/lib.rs; do
            if ! head -n 5 "$f" | grep -q '^//!'; then
              echo "::error file=$f::missing //! crate-level rustdoc"
              fail=1
            fi
          done
          exit $fail
