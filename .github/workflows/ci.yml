name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs-sync:
    name: docs-sync (L1/L2/L3 enforcement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every crate must have a README.md (L2)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for d in crates/*/ xtask/; do
            if [ ! -f "$d/README.md" ]; then
              echo "::error file=$d::missing README.md (L2 docs are mandatory)"
              fail=1
            fi
          done
          exit $fail
      - name: lib crates must have a top-level //! doc comment
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for f in crates/*/src/lib.rs; do
            if ! head -n 5 "$f" | grep -q '^//!'; then
              echo "::error file=$f::missing //! crate-level rustdoc"
              fail=1
            fi
          done
          exit $fail
