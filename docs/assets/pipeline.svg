<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" font-family="ui-sans-serif,system-ui,sans-serif">
  <rect width="860" height="250" fill="#0d1117"/>
  <text x="430" y="32" fill="#e6edf3" font-size="18" font-weight="700" text-anchor="middle">agentprof — read sessions → analyze → report</text>

  <!-- stage boxes -->
  <g>
    <rect x="24" y="78" width="150" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="99" y="106" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">sessions</text>
    <text x="99" y="126" fill="#8b949e" font-size="11" text-anchor="middle">Copilot CLI</text>
    <text x="99" y="142" fill="#6e7681" font-size="10" text-anchor="middle">~/.copilot/…jsonl</text>
  </g>
  <g>
    <rect x="222" y="78" width="150" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="297" y="106" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">adapter</text>
    <text x="297" y="126" fill="#8b949e" font-size="11" text-anchor="middle">events → Episodes</text>
    <text x="297" y="142" fill="#6e7681" font-size="10" text-anchor="middle">turns·tools·hooks</text>
  </g>
  <g>
    <rect x="420" y="78" width="150" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="495" y="106" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">analyzer</text>
    <text x="495" y="126" fill="#8b949e" font-size="11" text-anchor="middle">rank · waste · cache</text>
    <text x="495" y="142" fill="#6e7681" font-size="10" text-anchor="middle">+ --privacy redact</text>
  </g>
  <g>
    <rect x="618" y="60" width="218" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="727" y="84" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">report</text>
    <text x="727" y="108" fill="#8b949e" font-size="11" text-anchor="middle">md · json · csv</text>
    <text x="727" y="128" fill="#8b949e" font-size="11" text-anchor="middle">TUI flamegraph</text>
    <text x="727" y="148" fill="#8b949e" font-size="11" text-anchor="middle">html · speedscope</text>
    <text x="727" y="168" fill="#6e7681" font-size="10" text-anchor="middle">SQLite · OTLP · serve</text>
  </g>

  <!-- arrows -->
  <g stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M176 117 H218"/><path d="M374 117 H416"/><path d="M572 117 H614"/>
  </g>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#3fb950"/></marker></defs>
  <text x="430" y="220" fill="#6e7681" font-size="12" text-anchor="middle">differentiator: which MCP tools were loaded but never called — waste, not just spend</text>
</svg>
