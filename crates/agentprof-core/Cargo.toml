[package]
name        = "agentprof-core"
publish     = false  # M1.7 D-3 — internal lib; release goes via cli + cargo-dist
description = "Core domain model, tokenizer, analyzer, and exporters for agentprof."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
version.workspace      = true

[lints]
workspace = true

[features]
default = []
# Enable the optional Anthropic `count_tokens` HTTP API for precise tokenization.
anthropic-api = ["dep:reqwest", "dep:tokio"]
# Enable `clap::ValueEnum` derive on public enums (e.g. `AgentKind`) so
# `agentprof-cli` can use them directly in clap args without leaking
# clap into the core domain.
clap-derive   = ["dep:clap"]

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
chrono      = { workspace = true }
tracing     = { workspace = true }
sha2        = { workspace = true }
tiktoken-rs = { workspace = true }

clap    = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio   = { workspace = true, optional = true }
