[package]
name        = "agentprof-storage"
publish     = false  # M1.7 D-3 — internal lib; release goes via cli + cargo-dist
description = "SQLite persistence and OTLP telemetry receiver for agentprof."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
version.workspace      = true

[lints]
workspace = true

[features]
default = []
# Enable the CLI ingest progress bar (used by `agentprof ingest`).
progress = ["dep:indicatif"]
# Enable the OTLP receiver (subscribes to Claude Code telemetry).
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tonic",
    "dep:prost",
    "dep:tokio",
    "dep:axum",
    "dep:axum-server",
    "dep:bytes",
    "dep:rustls",
    "dep:tower",
    "dep:dashmap",
    "dep:subtle",
]
axum-server = ["dep:axum-server"]

[dependencies]
agentprof-core     = { workspace = true }
rusqlite           = { workspace = true, features = ["bundled"] }
rusqlite_migration = { workspace = true }
serde              = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
chrono             = { workspace = true }
dirs               = { workspace = true }

indicatif          = { workspace = true, optional = true }

opentelemetry       = { workspace = true, optional = true }
opentelemetry-otlp  = { workspace = true, optional = true }
opentelemetry_sdk   = { workspace = true, optional = true }
tonic               = { workspace = true, optional = true }
prost               = { workspace = true, optional = true }
tokio               = { workspace = true, optional = true }
axum                = { workspace = true, optional = true }
bytes               = { workspace = true, optional = true }
rustls              = { workspace = true, optional = true }
tower               = { workspace = true, optional = true }
axum-server         = { workspace = true, optional = true }
dashmap             = { workspace = true, optional = true }
subtle              = { workspace = true, optional = true }

[build-dependencies]
tonic-build = { workspace = true }
prost-build = "0.13"
# Vendored `protoc` binaries for linux/macos/windows (x86_64 + aarch64).
# Lets `tonic_build` compile the OTLP `.proto` files without requiring a
# system `protoc` install (which the GitHub-hosted CI runners lack out
# of the box). `build.rs` only consumes this when the `otlp` feature is
# enabled, so default builds still pay only the dep-resolution cost,
# not the binary-fetch cost.
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = { workspace = true }
rcgen    = { workspace = true }
toml     = { workspace = true }
# `test-util` (paused clock, `tokio::time::advance`) is only needed by the
# OTLP sweeper lifecycle tests; everything else uses the workspace defaults.
tokio    = { workspace = true, features = ["test-util"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic"] }
reqwest  = { workspace = true }
