[package]
name        = "agentprof-cli"
description = "agentprof — perf flamegraph + ROI profiler for AI coding agents."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
version.workspace      = true

[lints]
workspace = true

[[bin]]
name = "agentprof"
path = "src/main.rs"

[features]
# `default = ["full"]` gives `cargo install agentprof` the batteries-included experience.
default = ["full"]
full    = ["anthropic-api", "otlp", "web"]

anthropic-api = ["agentprof-core/anthropic-api"]
otlp          = ["agentprof-storage/otlp", "dep:tokio"]
# Web dashboard (`agentprof serve`, M2.3). Pulls in axum + tower stack
# and shells out to the browser via `open`. `askama` is already a
# hard dep (used for the existing HTML export), so it's not gated
# here — askama 0.16 renders to `String` which axum wraps with
# `axum::response::Html` directly (no `askama_axum` needed).
web           = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tokio", "dep:open"]

[dependencies]
agentprof-core     = { workspace = true, features = ["clap-derive"] }
agentprof-adapters = { workspace = true }
agentprof-storage  = { workspace = true }
agentprof-tui      = { workspace = true }

clap               = { workspace = true }
csv                = { workspace = true }
toml               = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
chrono             = { workspace = true }
directories        = { workspace = true }
askama             = { workspace = true }
notify-debouncer-mini = { workspace = true }

# OTLP receiver runtime (feature `otlp`). The workspace `tokio` already
# carries `rt-multi-thread` + `macros` + `time` + `net`; we layer the
# `signal` feature on top so the receiver can react to SIGINT/SIGTERM
# (`tokio::signal::unix::SignalKind`).
tokio              = { workspace = true, optional = true, features = ["signal"] }

# Web dashboard (feature `web`, M2.3). All four are workspace-pinned;
# `axum` + `tower` are shared with the OTLP receiver, so enabling
# `web` alongside `otlp` doesn't double-compile them.
axum               = { workspace = true, optional = true }
tower              = { workspace = true, optional = true }
tower-http         = { workspace = true, optional = true }
open               = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
insta      = { workspace = true }
tempfile   = { workspace = true }
rusqlite   = { workspace = true }

# End-to-end OTLP receiver tests (`tests/cli_ingest_otlp_e2e.rs`) spawn
# the `agentprof ingest-otlp` binary and push wire-format envelopes via
# a real OTel client. All deps are workspace-pinned; no new entries in
# `[workspace.dependencies]`.
opentelemetry-proto = { workspace = true, features = ["gen-tonic"] }
tonic               = { workspace = true }
reqwest             = { workspace = true }
prost               = { workspace = true }
tokio               = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
agentprof-storage   = { workspace = true, features = ["otlp"] }
