# cargo-deny configuration. Run `cargo deny check` locally; CI runs it on every PR.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# Ignored advisories — each entry MUST cite (a) the advisory ID,
# (b) why we cannot fix it ourselves, (c) the upstream tracking link,
# (d) the re-evaluation trigger.
ignore = [
    # RUSTSEC-2024-0436: `paste` 1.0.15 is no longer maintained per
    # dtolnay/paste README (crate archived 2024). Reaches us
    # transitively via `ratatui` 0.29.0 → `paste` 1.0.15.
    #
    # - (a) advisory: https://rustsec.org/advisories/RUSTSEC-2024-0436
    # - (b) cannot fix: ratatui 0.29.x still depends on paste; replacing
    #       ratatui is a major TUI rewrite (ADR-0007 picks ratatui).
    # - (c) upstream: https://github.com/ratatui/ratatui (tracking issue
    #       opened for paste replacement; switch likely uses `pastey`
    #       or `with_builtin_macros`).
    # - (d) re-evaluate: when ratatui ships a release that drops the
    #       paste dependency (any ratatui 0.30+ candidate; remove this
    #       ignore when our Cargo.lock no longer lists paste 1.0.x).
    "RUSTSEC-2024-0436",
    # RUSTSEC-2025-0119: `number_prefix` 0.4.0 is no longer maintained
    # (https://github.com/ogham/rust-number-prefix/pull/8). Reaches us
    # transitively via `indicatif` 0.17.11 → `number_prefix` 0.4.0.
    #
    # - (a) advisory: https://rustsec.org/advisories/RUSTSEC-2025-0119
    # - (b) cannot fix: indicatif 0.17.x depends on number_prefix; no
    #       upstream release migrating to `unit-prefix` yet. Replacing
    #       indicatif is a CLI UX rewrite for `db ingest` progress.
    # - (c) upstream: https://github.com/console-rs/indicatif (tracking
    #       depends on indicatif 0.18+ adopting unit-prefix).
    # - (d) re-evaluate: when indicatif ships a release that drops the
    #       number_prefix dependency (likely indicatif 0.18+; remove
    #       this ignore when our Cargo.lock no longer lists
    #       number_prefix 0.4.x).
    "RUSTSEC-2025-0119",
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # Community Data License Agreement Permissive 2.0 — used by
    # `webpki-roots` 1.0.x to license the bundled Mozilla CA root
    # certificates *data set* (the crate's Rust code itself is
    # MPL-2.0/Apache-2.0/MIT, but the data carries its own SPDX tag).
    # CDLA-Permissive-2.0 is OSI-equivalent permissive
    # (https://cdla.dev/permissive-2-0/): no copyleft, no patent
    # restrictions, attribution only. Reaches us transitively via
    # `reqwest` → `hyper-rustls` → `webpki-roots`.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
