# cargo-dist configuration (M1.7 D-11).
#
# Edit via `cargo dist init` rather than by hand — running
# `cargo dist generate --mode ci` regenerates
# `.github/workflows/release.yml` from this file. Per ADR-0014 D-11,
# after regen we manually re-SHA-pin the new release.yml (see
# CONTRIBUTING.md "Updating cargo-dist" subsection).
#
# `publish-jobs` field is intentionally ABSENT (defaults to empty
# = no publish jobs) per ADR-0014 D-1: v0.1.0 does NOT publish to
# crates.io. To open crates.io publish later, remove `publish = false`
# on whichever lib crates we want, add `publish-jobs = ["cargo"]`
# below, and re-run `cargo dist init`.
#
# `targets` list intentionally has 4 platforms (linux/macos × x64/arm64);
# Windows is excluded per ADR-0014 D-5 (defer to v0.2+).

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Run only the 'plan' job on PRs (skip 4-platform builds for fast PR cycle).
# Real build + upload only triggers on tag push. (M1.7 D-11 follow-up after
# code review identified the default PR-build behavior as waste for a
# solo-maintainer repo.)
pr-run-mode = "plan"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
